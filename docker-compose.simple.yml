version: '3.8'

# Build locally:  docker compose -f docker-compose.simple.yml up --build
# Pull from GHCR: SWOOP_IMAGE=ghcr.io/ashmt/swoop:latest docker compose -f docker-compose.simple.yml up

services:
  app:
    image: ${SWOOP_IMAGE:-swoop-local}
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SQLITE_PATH=/app/data/swoop.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - AI_BASE_URL=${AI_BASE_URL:-http://host.docker.internal:11434/v1}
      - AI_API_KEY=${AI_API_KEY:-ollama}
      - AI_MODEL=${AI_MODEL:-qwen3:8b}
      - PORT=3000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
