<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="sheen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.5" stop-color="#2f6fe0"/>
      <stop offset="1" stop-color="#7c4ddc"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#sheen)"/>
  <!-- swoop trail -->
  <path d="M4 27.5c6.5 1.2 12.5-.6 17-5" stroke="#fff" stroke-opacity=".45" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <g transform="translate(16 16.6) scale(1.12) translate(-15.6 -14.4)">
  <!-- far wing -->
  <path d="M15.5 15.2 C 17 10.5, 20.5 6.5, 26.5 4.2 C 24.5 8, 22.2 11.6, 19.4 14.4 Z" fill="#0c0e13" opacity=".55"/>
  <!-- tail -->
  <path d="M19.8 15.8 L 28.6 12.6 L 27.8 14.6 L 20.6 17.9 Z" fill="#0c0e13"/>
  <!-- body -->
  <path d="M8.2 21.4 C 9.4 18.6, 13.6 15.6, 18.2 15.1 C 20.4 14.9, 21.4 16.2, 20.6 17.6 C 18.6 20.4, 13.6 23.2, 10 23.4 Z" fill="#0c0e13"/>
  <!-- white belly -->
  <path d="M11.4 22.6 C 14.4 21.9, 17.8 19.9, 19.9 17.8 C 18 20.6, 14.6 22.6, 11.4 22.6 Z" fill="#fff"/>
  <!-- near wing, raised -->
  <path d="M12.6 17.2 C 12.4 12.4, 14.6 7.4, 19.2 3.6 C 19 8.6, 17.6 13, 15.4 16.4 Z" fill="#0c0e13"/>
  <!-- white shoulder band -->
  <path d="M12.9 16.4 C 13.2 14.2, 14 12.4, 15.2 10.8 C 15.1 12.8, 14.6 14.8, 13.9 16.6 Z" fill="#fff"/>
  <!-- head -->
  <circle cx="8.6" cy="21.6" r="2.7" fill="#0c0e13"/>
  <!-- white nape -->
  <path d="M9.6 19.1 C 11 18.9, 11.8 19.8, 11.6 21 C 11 20.4, 10.4 19.9, 9.6 19.1 Z" fill="#fff"/>
  <!-- eye -->
  <circle cx="7.9" cy="21.2" r=".6" fill="#c2552e"/>
  <!-- beak -->
  <path d="M6.2 22.2 L 3.2 24.4 L 6.8 23.5 Z" fill="#dfe6ec"/>
  <path d="M4.1 23.7 L 3.2 24.4 L 4.3 24.1 Z" fill="#0c0e13"/>
  </g>
</svg>
